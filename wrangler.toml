name = "accessfix"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Site: run `npm run build` first (Workers Builds: build command "npm run build")
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/r/*", "/de/r/*"]

[[routes]]
pattern = "accessfix.net"
custom_domain = true

# Headless Chrome for the free check
[browser]
binding = "BROWSER"

# Reports, rate limits, leads (namespace "accessfix-reports")
[[kv_namespaces]]
binding = "REPORTS"
id = "7e46c48df730442680d957691e039065"

[vars]
DAILY_LIMIT = "150"     # Workers Paid. On the free plan use 12.

# Workers Paid: allow enough CPU time for driving the browser
[limits]
cpu_ms = 300000

[observability]
enabled = true

# Lead notifications to the Site First Gmail. Enable after Email Routing is on for accessfix.net
# and sitefirststudio@gmail.com is a verified destination address:
# [[send_email]]
# name = "NOTIFY"
# destination_address = "sitefirststudio@gmail.com"
# [vars] NOTIFY_FROM = "check@accessfix.net"  NOTIFY_TO = "sitefirststudio@gmail.com"
